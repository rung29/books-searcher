<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伸港圖書館認證書籍清單</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-primary: #fffaf5;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-hover: #ffffff;
      --bg-inner: rgba(254, 243, 235, 0.65);
      --text-primary: #292524;
      --text-secondary: #78716c;
      --text-muted: #a8a29e;
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --accent-light: #ffedd5;
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      --border: rgba(254, 215, 170, 0.8);
      --border-subtle: rgba(231, 229, 228, 0.85);
      --border-focus: #f97316;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-text: #059669;
      --success-border: rgba(16, 185, 129, 0.25);
      --call-bg: #fff7ed;
      --call-text: #c2410c;
      --call-border: #fed7aa;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 16px -2px rgba(234, 88, 12, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 25px -3px rgba(234, 88, 12, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
      --glass-blur: blur(14px);
    }

    [data-theme="dark"] {
      --bg-primary: #14110e;
      --bg-card: rgba(28, 25, 23, 0.92);
      --bg-card-hover: rgba(38, 34, 31, 0.98);
      --bg-inner: rgba(41, 37, 36, 0.65);
      --text-primary: #fafaf9;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --accent: #fb923c;
      --accent-hover: #f97316;
      --accent-light: rgba(251, 146, 60, 0.18);
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      --border: rgba(120, 113, 108, 0.4);
      --border-subtle: rgba(68, 64, 60, 0.6);
      --border-focus: #fb923c;
      --success-bg: rgba(16, 185, 129, 0.2);
      --success-text: #34d399;
      --success-border: rgba(16, 185, 129, 0.35);
      --call-bg: rgba(251, 146, 60, 0.15);
      --call-text: #fdba74;
      --call-border: rgba(251, 146, 60, 0.3);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px 0 rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 10% 10%, rgba(249, 115, 22, 0.08), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(234, 88, 12, 0.06), transparent 35%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 24px;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
      flex-shrink: 0;
    }

    .header-title-group h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .header-title-group p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-gradient);
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn-nav:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.38);
      opacity: 0.95;
    }

    .btn-nav:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-inner);
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-icon:hover {
      transform: scale(1.05);
      border-color: var(--accent);
    }

    .panel {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      font-size: 1.1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 50px;
      padding: 0 88px 0 46px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--bg-inner);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-card-hover);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.18);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear-btn:hover {
      color: var(--accent);
      background: var(--accent-light);
    }

    .voice-search-btn {
      position: absolute;
      right: 46px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--accent);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .voice-search-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      transform: scale(1.05);
    }

    .voice-search-btn.recording {
      color: #ffffff;
      background: #ef4444;
      border-color: #ef4444;
      animation: voice-pulse 1.35s ease-in-out infinite;
    }

    .voice-search-btn[hidden] {
      display: none;
    }

    @keyframes voice-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    .search-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .results-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .results-toolbar-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .page-size-select {
      min-height: 38px;
      padding: 0 34px 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-inner);
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .pagination-top {
      margin-top: 0;
    }

    .page-btn {
      min-width: 40px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-inner);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .page-info {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 700;
      min-width: 96px;
      text-align: center;
    }

    .warning-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      color: #b45309;
      font-size: 0.88rem;
      margin-bottom: 14px;
    }

    [data-theme="dark"] .warning-banner {
      color: #fbbf24;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .book-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .book-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1.4;
    }

    .book-title:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .book-meta {
      font-size: 0.88rem;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: center;
    }

    .book-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .book-matched {
      font-size: 0.88rem;
      color: var(--text-secondary);
      padding: 8px 12px;
      background: var(--bg-inner);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .book-matched a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .book-matched a:hover {
      text-decoration: underline;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .pill-call {
      background: var(--call-bg);
      color: var(--call-text);
      border: 1px solid var(--call-border);
    }

    .pill-status {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .pill-none {
      background: var(--bg-inner);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .group-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .group-toggle-btn {
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      transition: background-color 0.2s ease;
    }

    .group-toggle-btn:hover {
      background: var(--bg-inner);
      color: var(--accent);
    }

    .group-count-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      margin-left: 8px;
    }

    .group-arrow {
      font-size: 0.85rem;
      transition: transform 0.2s ease;
      color: var(--text-muted);
    }

    .group-toggle-btn[aria-expanded="true"] .group-arrow {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .group-items {
      display: grid;
      gap: 10px;
      padding: 14px 16px;
      background: var(--bg-inner);
      border-top: 1px solid var(--border);
    }

    .muted-text {
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
      font-size: 0.95rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 10px 32px;
      }
      .app-header {
        padding: 16px;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .btn-nav {
        flex: 1;
        justify-content: center;
      }
      .panel {
        padding: 16px;
      }
      .panel-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
      .results-toolbar,
      .results-toolbar-group {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">📚</div>
      <div class="header-title-group">
        <h1>伸港圖書館認證書籍清單</h1>
      </div>
    </div>
    <div class="header-actions">
      <a href="ebooks_index.html" class="btn-nav" id="switch-to-ebooks">
        <span>📖</span>
        <span>切換至電子書資源</span>
      </a>
      <button type="button" class="btn-icon" id="theme-toggle" aria-label="切換深淺色模式" title="切換深淺色模式">🌙</button>
    </div>
  </header>

  <section class="panel">
    
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input id="search-input" class="search-input" type="search" placeholder="輸入書名、命中館藏、作者、出版社或索書號，例如：屁屁偵探、859.61、低年級 & 859* 1" autocomplete="off">
      <button type="button" class="voice-search-btn" id="voice-search" aria-label="語音輸入搜尋" title="語音輸入搜尋">🎤</button>
      <button type="button" class="search-clear-btn" id="search-clear" aria-label="清除搜尋">&times;</button>
    </div>
    <div class="search-meta-row">
      <span>搜尋條件支援關鍵字與 <code>*</code> 通配符號</span>
      <span class="count-badge" id="result-count">資料讀取中...</span>
    </div>
  </section>

  <section class="panel" id="groups-section">
    <div class="panel-header">
      <h2 class="panel-title"><span>📂</span> 相似書名群組</h2>
    </div>
    <div class="list" id="groups-list"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2 class="panel-title" id="results-title"><span>📋</span> 全部館藏</h2>
      <div class="results-toolbar-group">
        <div class="pagination pagination-top hidden" id="pagination-top">
          <button type="button" class="page-btn" id="prev-page-top" aria-label="上一頁">‹</button>
          <span class="page-info" id="page-info-top">第 1 / 1 頁</span>
          <button type="button" class="page-btn" id="next-page-top" aria-label="下一頁">›</button>
        </div>
        <label class="results-toolbar" for="page-size">
          <span>每頁顯示</span>
          <select class="page-size-select" id="page-size">
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </div>
    <div class="list" id="results-list"></div>
    <div class="pagination hidden" id="pagination">
      <button type="button" class="page-btn" id="prev-page" aria-label="上一頁">‹</button>
      <span class="page-info" id="page-info">第 1 / 1 頁</span>
      <button type="button" class="page-btn" id="next-page" aria-label="下一頁">›</button>
    </div>

<script>
const DATA_URL = "books_with_library_data.json";
const searchInput = document.getElementById("search-input");
const searchClearBtn = document.getElementById("search-clear");
const resultCount = document.getElementById("result-count");
const groupsSection = document.getElementById("groups-section");
const groupsList = document.getElementById("groups-list");
const resultsTitle = document.getElementById("results-title");
const resultsList = document.getElementById("results-list");
const themeToggleBtn = document.getElementById("theme-toggle");
const voiceSearchBtn = document.getElementById("voice-search");
const pageSizeSelect = document.getElementById("page-size");
const pagination = document.getElementById("pagination");
const paginationTop = document.getElementById("pagination-top");
const prevPageBtn = document.getElementById("prev-page");
const prevPageTopBtn = document.getElementById("prev-page-top");
const nextPageBtn = document.getElementById("next-page");
const nextPageTopBtn = document.getElementById("next-page-top");
const pageInfo = document.getElementById("page-info");
const pageInfoTop = document.getElementById("page-info-top");
let books = [];
let filteredBooks = [];
let currentPage = 1;
let pageSize = 20;

function resultsHeadingText() {
  return resultsTitle.textContent.replace(/^📋\s*/, "") || "搜尋結果";
}

function syncPagination(totalPages) {
  const shouldShow = filteredBooks.length > pageSize;
  pagination.classList.toggle("hidden", !shouldShow);
  paginationTop.classList.toggle("hidden", !shouldShow);
  pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁`;
  pageInfoTop.textContent = pageInfo.textContent;
  prevPageBtn.disabled = currentPage === 1;
  prevPageTopBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages;
  nextPageTopBtn.disabled = currentPage === totalPages;
}

function initTheme() {
  const savedTheme = localStorage.getItem("books_theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", savedTheme);
  themeToggleBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";
}

themeToggleBtn.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("books_theme", next);
  themeToggleBtn.textContent = next === "dark" ? "☀️" : "🌙";
});

initTheme();

function normalize(value) {
  return String(value || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}*]+/gu, "");
}

function searchableFields(book, query) {
  const callNumberLike = /^[0-9*]+$/.test(query) && /[0-9]/.test(query);
  const values = callNumberLike
    ? (book.call_numbers || [])
    : [
        book.title,
        book.matched_title,
        book.author,
        book.publisher,
        book.range,
        book.certification,
        ...(book.call_numbers || []),
        ...(book.library_statuses || [])
      ];
  return values.map(normalize).filter(Boolean);
}

function normalizeCallPart(value) {
  return String(value || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}*]+/gu, "");
}

function callNumberTokens(callNumber) {
  return String(callNumber || "")
    .normalize("NFKC")
    .toLowerCase()
    .split(/\s+/)
    .map(normalizeCallPart)
    .filter(part => /\d/.test(part));
}

function wildcardRegex(query) {
  const escaped = query
    .split("*")
    .map(part => part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .join(".*");
  return new RegExp(escaped);
}

function wildcardPrefixRegex(query) {
  const escaped = query
    .split("*")
    .map(part => part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .join(".*");
  return new RegExp(`^${escaped}`);
}

function callQueryParts(rawQuery, normalizedQuery) {
  const spacedParts = String(rawQuery || "")
    .normalize("NFKC")
    .trim()
    .split(/\s+/)
    .map(normalizeCallPart)
    .filter(Boolean);
  if (spacedParts.length > 1) {
    return spacedParts;
  }
  const compactMatch = normalizedQuery.match(/^(\d+)\*(\d+)$/);
  if (compactMatch) {
    return [`${compactMatch[1]}*`, compactMatch[2]];
  }
  return [];
}

function matchesCallNumber(book, rawQuery, normalizedQuery) {
  const parts = callQueryParts(rawQuery, normalizedQuery);
  if (parts.length > 0) {
    return (book.call_numbers || []).some(callNumber => {
      const tokens = callNumberTokens(callNumber);
      if (tokens.length < parts.length) {
        return false;
      }
      const firstMatcher = wildcardPrefixRegex(parts[0]);
      for (let start = 0; start <= tokens.length - parts.length; start += 1) {
        if (!firstMatcher.test(tokens[start])) {
          continue;
        }
        const restMatches = parts.slice(1).every((part, offset) =>
          wildcardPrefixRegex(part.includes("*") ? part : `${part}*`).test(tokens[start + offset + 1])
        );
        if (restMatches) {
          return true;
        }
      }
      return false;
    });
  }

  const fields = (book.call_numbers || []).map(normalize).filter(Boolean);
  if (normalizedQuery.includes("*")) {
    const matcher = wildcardRegex(normalizedQuery);
    return fields.some(field => matcher.test(field));
  }
  return fields.some(field => field.includes(normalizedQuery));
}

function matchesSearch(book, rawQuery) {
  const query = normalize(rawQuery);
  if (!query) {
    return true;
  }
  if (/^[0-9*]+$/.test(query) && /[0-9]/.test(query)) {
    return matchesCallNumber(book, rawQuery, query);
  }
  const fields = searchableFields(book, query);
  if (query.includes("*")) {
    const matcher = wildcardRegex(query);
    return fields.some(field => matcher.test(field));
  }
  return fields.some(field => field.includes(query));
}

function searchConditions(value) {
  return String(value || "")
    .split("&")
    .map(part => part.trim())
    .filter(Boolean);
}

function seriesKey(title) {
  let value = String(title || "").normalize("NFKC");
  value = value.replace(/[《》「」『』【】\[\]()（）]/g, " ");
  value = value.split(/[：:]/)[0];
  value = value.replace(/\s*(第\s*)?[0-9０-９一二三四五六七八九十]+\s*(集|冊|卷|本)?\s*$/u, "");
  value = value.replace(/\s+/g, " ").trim();
  return value || title;
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function bookHtml(book) {
  const calls = (book.call_numbers || []).map(call => `<span class="pill pill-call">索書號: ${escapeHtml(call)}</span>`).join("");
  const statuses = (book.library_statuses || []).map(status => `<span class="pill pill-status">${escapeHtml(status)}</span>`).join("");
  const titleHref = book.url || book.matched_url || "#";
  const metaItems = [
    book.author ? `<span class="book-meta-item">✍️ ${escapeHtml(book.author)}</span>` : "",
    book.publisher ? `<span class="book-meta-item">🏢 ${escapeHtml(book.publisher)}</span>` : "",
    book.range ? `<span class="book-meta-item">🎓 ${escapeHtml(book.range)}</span>` : "",
    book.certification ? `<span class="book-meta-item">⭐ ${escapeHtml(book.certification)}</span>` : ""
  ].filter(Boolean).join(" · ");

  return `<article class="book-card">
    <div class="book-header">
      <a class="book-title" href="${escapeHtml(titleHref)}" target="_blank" rel="noopener">${escapeHtml(book.title)}</a>
    </div>
    <div class="book-meta">${metaItems || "-"}</div>
    <div class="book-matched">
      <strong>命中館藏：</strong>${book.matched_url ? `<a href="${escapeHtml(book.matched_url)}" target="_blank" rel="noopener">${escapeHtml(book.matched_title || "-")}</a>` : escapeHtml(book.matched_title || "-")}
    </div>
    <div class="book-tags">${calls || '<span class="pill pill-none">無索書號</span>'} ${statuses}</div>
  </article>`;
}

function renderResults(items, title = "搜尋結果") {
  filteredBooks = items;
  const totalPages = Math.max(1, Math.ceil(filteredBooks.length / pageSize));
  currentPage = Math.min(Math.max(currentPage, 1), totalPages);
  const startIndex = (currentPage - 1) * pageSize;
  const pageItems = filteredBooks.slice(startIndex, startIndex + pageSize);

  resultsTitle.innerHTML = `<span>📋</span> ${escapeHtml(title)}`;
  resultCount.textContent = filteredBooks.length
    ? `共 ${filteredBooks.length} 本有館藏書籍，顯示 ${startIndex + 1}-${Math.min(startIndex + pageItems.length, filteredBooks.length)} 本`
    : "共 0 本有館藏書籍";
  resultsList.innerHTML = pageItems.length
    ? pageItems.map(bookHtml).join("")
    : '<p class="muted-text">沒有符合條件的館藏書籍。</p>';
  syncPagination(totalPages);
}

function renderGroups() {
  const groups = new Map();
  books.forEach(book => {
    const key = seriesKey(book.title);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(book);
  });
  const grouped = Array.from(groups.entries())
    .filter(([, items]) => items.length > 1)
    .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "zh-Hant"));

  groupsSection.classList.toggle("hidden", grouped.length === 0);
  groupsList.innerHTML = grouped.map(([key, items], index) => `
    <article class="group-card">
      <button type="button" class="group-toggle-btn" data-group-index="${index}" aria-expanded="false">
        <span>${escapeHtml(key)} <span class="group-count-tag">${items.length} 本</span></span>
        <span class="group-arrow">▼</span>
      </button>
      <div class="group-items hidden" id="group-${index}">
        ${items.map(bookHtml).join("")}
      </div>
    </article>
  `).join("");
  groupsList.querySelectorAll("button[data-group-index]").forEach(button => {
    button.addEventListener("click", () => {
      const target = document.getElementById(`group-${button.dataset.groupIndex}`);
      const isHidden = target.classList.toggle("hidden");
      button.setAttribute("aria-expanded", (!isHidden).toString());
    });
  });
}

function applySearch() {
  const rawValue = searchInput.value;
  currentPage = 1;
  searchClearBtn.style.display = rawValue ? "flex" : "none";
  const conditions = searchConditions(rawValue);
  if (conditions.length === 0) {
    renderResults(books, "全部館藏");
    groupsSection.classList.remove("hidden");
    return;
  }
  groupsSection.classList.add("hidden");
  renderResults(
    books.filter(book => conditions.every(condition => matchesSearch(book, condition))),
    "搜尋結果"
  );
}

searchClearBtn.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.focus();
  applySearch();
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition && voiceSearchBtn) {
  const recognition = new SpeechRecognition();
  recognition.lang = "zh-TW";
  recognition.continuous = false;
  recognition.interimResults = false;
  let isRecording = false;

  function stopVoiceSearch() {
    isRecording = false;
    voiceSearchBtn.classList.remove("recording");
    voiceSearchBtn.textContent = "🎤";
    try {
      recognition.stop();
    } catch {}
  }

  voiceSearchBtn.addEventListener("click", () => {
    if (isRecording) {
      stopVoiceSearch();
      return;
    }
    try {
      recognition.start();
      isRecording = true;
      voiceSearchBtn.classList.add("recording");
      voiceSearchBtn.textContent = "■";
    } catch {
      stopVoiceSearch();
    }
  });

  recognition.addEventListener("result", event => {
    const transcript = event.results[0][0].transcript.trim();
    if (transcript) {
      searchInput.value = transcript;
      applySearch();
    }
  });

  recognition.addEventListener("end", stopVoiceSearch);
  recognition.addEventListener("error", stopVoiceSearch);
} else if (voiceSearchBtn) {
  voiceSearchBtn.hidden = true;
}

pageSizeSelect.addEventListener("change", () => {
  pageSize = Number(pageSizeSelect.value) || 20;
  currentPage = 1;
  renderResults(filteredBooks, resultsHeadingText());
});

function goToPreviousPage() {
  if (currentPage > 1) {
    currentPage -= 1;
    renderResults(filteredBooks, resultsHeadingText());
    resultsTitle.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function goToNextPage() {
  const totalPages = Math.ceil(filteredBooks.length / pageSize);
  if (currentPage < totalPages) {
    currentPage += 1;
    renderResults(filteredBooks, resultsHeadingText());
    resultsTitle.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

prevPageBtn.addEventListener("click", goToPreviousPage);
prevPageTopBtn.addEventListener("click", goToPreviousPage);
nextPageBtn.addEventListener("click", goToNextPage);
nextPageTopBtn.addEventListener("click", goToNextPage);

function initializeBooks(data) {
  books = Array.isArray(data) ? data : [];
  renderGroups();
  applySearch();
}

function embeddedBooks() {
  const element = document.getElementById("books-data");
  if (!element) {
    return null;
  }
  try {
    const data = JSON.parse(element.textContent || "[]");
    return Array.isArray(data) ? data : null;
  } catch {
    return null;
  }
}

const initialBooks = embeddedBooks();
if (initialBooks) {
  initializeBooks(initialBooks);
} else {
  fetch(DATA_URL)
    .then(response => response.json())
    .then(initializeBooks)
    .catch(() => {
      resultCount.textContent = "無法讀取 books_with_library_data.json。請確認檔案與首頁放在同一個目錄。";
    });
}

searchInput.addEventListener("input", applySearch);
</script>
</body>
</html>
